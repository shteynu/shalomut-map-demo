[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shalomut-ai-analytics"
version = "0.1.0"
description = "Decoupled AI Analytics Microservice for Teachers' Wellbeing Map (מפת שלומות)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "langgraph>=0.0.30",
    "langchain>=0.1.15",
    "langchain-core>=0.1.42",
    "langchain-openai>=0.1.3",
    "mcp>=0.1.0",
    "chromadb>=0.4.24",
    "sentence-transformers>=2.6.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
