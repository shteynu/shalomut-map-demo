# Render blueprint for the isolated AI analytics service.
# Free plan instances sleep after 15 minutes of inactivity; the first request
# after a sleep pays a cold start of roughly a minute.
services:
  - type: web
    name: shalomut-ai-analytics
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: USE_MOCK_MCP
        value: "false"
      # Set in the Render dashboard; never committed.
      - key: DATA_LAYER_MCP_URL
        sync: false
      - key: DATA_LAYER_CALLBACK_URL
        sync: false
      - key: MCP_SHARED_SECRET
        sync: false
      - key: AI_WEBHOOK_SECRET
        sync: false
      - key: AI_CALLBACK_SECRET
        sync: false
      - key: VERCEL_PROTECTION_BYPASS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MAX_CONCURRENT_REQUESTS
        sync: false
      # Carries a value rather than `sync: false`: the free tier refuses on the
      # rate, so this one has to be visible and set in the dashboard instead of
      # living on a default nobody can see. Five per minute is Google's free
      # tier for gemini-3.5-flash, read 2026-07-29. Raise it for a paid tier.
      - key: LLM_MAX_REQUESTS_PER_MINUTE
        value: "5"
      - key: LLM_MODEL_FAST
        sync: false
      - key: LLM_MODEL_HEAVY
        sync: false
