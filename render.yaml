# Render blueprint for the isolated AI analytics service.
# Free plan instances sleep after 15 minutes of inactivity; the first request
# after a sleep pays a cold start of roughly a minute.
services:
  - type: web
    name: shalomut-ai-analytics
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: USE_MOCK_MCP
        value: "false"
      # Set in the Render dashboard; never committed.
      - key: DATA_LAYER_MCP_URL
        sync: false
      - key: DATA_LAYER_CALLBACK_URL
        sync: false
      - key: MCP_SHARED_SECRET
        sync: false
      - key: AI_WEBHOOK_SECRET
        sync: false
      - key: AI_CALLBACK_SECRET
        sync: false
      - key: VERCEL_PROTECTION_BYPASS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MAX_CONCURRENT_REQUESTS
        sync: false
      # These two carry values rather than `sync: false`: the quota is what
      # every live round has died on, so the model and the pace it is paced at
      # belong together and in sight, not on a default nobody can read.
      #
      # Fourteen, not the fifteen the tier allows. Evenly spaced sends land
      # every 60/R seconds, and at exactly fifteen that is four seconds — a
      # sixty-second window then catches both endpoints, sixteen sends, one
      # over. Any rate below fifteen leaves the window at fifteen. The four
      # seconds this costs a round are not worth a `429`.
      - key: LLM_MAX_REQUESTS_PER_MINUTE
        value: "14"
      # Free tier for this model, read in AI Studio 2026-07-29: 15 RPM and
      # 1000 RPD, against 5 and 20 for gemini-3.5-flash. Limits are counted per
      # model, so this is a different budget rather than a bigger share of the
      # same one — and 1000 a day against 17 a round is what turns one debug
      # round per day into roughly sixty. Its Hebrew was checked on this
      # project's own 5.0 prompts the same day.
      - key: LLM_MODEL_FAST
        value: "gemini-3.5-flash-lite"
      # Left on the dashboard, and left on gemini-3.5-flash. It is only reached
      # when the whole node is replayed, so it borrows a bucket the fast path
      # no longer touches — see the note in PROGRESS.md about the pace a replay
      # would run at.
      - key: LLM_MODEL_HEAVY
        sync: false
