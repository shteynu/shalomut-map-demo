# Render blueprint for the isolated AI analytics service.
# Free plan instances sleep after 15 minutes without *inbound* traffic, and the
# first request after a sleep pays a cold start of roughly a minute. The cold
# start is the smaller half: durable analysis jobs are pulled by this service
# from Core's `/api/ai-analysis-runs/claim`, so a sleeping instance is not a
# slow instance, it is one that claims nothing until something knocks. Its
# own polling is outbound and does not count as traffic.
#
# The knocking is an external uptime monitor in the owner's UptimeRobot account
# — keyword `GET /health` every five minutes — and not this repository. The cron
# in `.github/workflows/render-keepalive.yml` was removed on 2026-08-05 because
# GitHub's scheduler skipped ten consecutive windows; what the workflow still
# offers is a manual wake. `docs/shalomut-tracker-handoff.md` names the monitor.
services:
  - type: web
    name: shalomut-ai-analytics
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Which pushes to `main` are this service's business. The build context is
    # the whole repository, but `.dockerignore` lets only three things into the
    # image, and these paths are that list plus this file — an env var here is
    # a reason to redeploy even when no code moved.
    #
    # Without it every push rebuilt this service, Core-only and docs-only pushes
    # included. A free instance has no zero-downtime swap: the old container
    # stops before the new one answers, so each of those rebuilds spent a few
    # minutes returning 502 and woke the uptime monitor. The 502 window at
    # 20:27 GMT+3 on 2026-08-09 came from a docs push nineteen minutes earlier.
    buildFilter:
      paths:
        - ai-analytics-service/**
        - contracts/**
        - Dockerfile
        - render.yaml
    envVars:
      - key: ENV
        value: production
      - key: USE_MOCK_MCP
        value: "false"
      # Set in the Render dashboard; never committed.
      - key: DATA_LAYER_MCP_URL
        sync: false
      - key: DATA_LAYER_CALLBACK_URL
        sync: false
      - key: MCP_SHARED_SECRET
        sync: false
      - key: AI_WEBHOOK_SECRET
        sync: false
      - key: AI_CALLBACK_SECRET
        sync: false
      - key: AI_JOB_POLLING_ENABLED
        value: "true"
      # How many rounds this container analyses at once, each holding its own
      # lease. Left at the default of one until a deployment actually needs
      # more: raising it is safe but it is a throughput decision, and the
      # number belongs next to the evidence for it rather than in a dashboard.
      #
      # What it buys, and why it comes before a second instance: a round is
      # about 28 provider calls over roughly three minutes — near 11 a minute
      # against the pace of 60 set below — so one round leaves most of the paid
      # quota unspent, and fifty schools closing together queue behind one
      # another for hours. Extra slots spend that idle quota instead. They are
      # safe to add because the pace is charged per process by one shared
      # limiter; two containers would keep two private counters and together
      # exceed the quota, which is the failure this knob exists to avoid.
      #
      # Past roughly 60/11 the pace becomes the binding limit and further slots
      # only queue behind it, so `config.py` caps this at 10.
      - key: AI_JOB_POOL_SIZE
        value: "1"
      # The ceiling on one dimension's answer, and it was the default — 2048 in
      # `config.py` — until 2026-08-09, when a local run of the real pipeline
      # over a 24-question round showed what that costs: every call came back
      # `finish_reason=length`, the JSON stopped mid-object, and all eight
      # stones fell to `deterministic_fallback`. The round still reported
      # success, which is why this could sit unnoticed — nothing fails, the map
      # just quietly stops being written by the model.
      #
      # Measured on that round: 2048 loses all eight stones, 4096 still
      # truncates twelve calls and loses one, 8192 returns eight `llm` stones on
      # the first attempt. Declared here rather than left to the dashboard for
      # the same reason as the pacing above — a limit nobody can read is a limit
      # nobody can check.
      - key: MAX_TOKENS_PER_DIMENSION
        value: "8192"
      - key: VERCEL_PROTECTION_BYPASS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MAX_CONCURRENT_REQUESTS
        sync: false
      # These two carry values rather than `sync: false`: the quota is what
      # every live round has died on, so the model and the pace it is paced at
      # belong together and in sight, not on a default nobody can read.
      #
      # Sixty since 2026-08-05, and the number is measured rather than read off
      # a tier table. The owner attached a billed Gemini key that day, and seven
      # eval-corpus runs went through the fast model at sixty a minute —
      # `gemini-3.5-flash-lite` then, `gemini-3.5-flash` since 2026-08-09 —
      # roughly 140 provider requests each — without one quota failure. The
      # fourteen this replaces was the free tier's fifteen minus the boundary
      # send, and it is what made a round take four seconds per request for no
      # reason a billed key can see.
      #
      # It rests on one fact this file cannot check: that `GEMINI_API_KEY` in
      # the Render dashboard is that billed key and not the free one it was set
      # to before. If it is the free key, sixty buys `429` on almost every send
      # — retried with `Retry-After`, so the round crawls rather than dies —
      # and the honest fix is to put the billed key on the dashboard, not to
      # move this number back.
      - key: LLM_MAX_REQUESTS_PER_MINUTE
        value: "60"
      # `gemini-3.5-flash`, and the reason is its Hebrew rather than its size.
      # Until 2026-08-09 this was `gemini-3.5-flash-lite`, chosen for its free
      # tier — 15 RPM and 1000 RPD against 5 and 20 for flash, counted per model
      # so a different budget rather than a bigger share of one. Then a full
      # round was run through the real pipeline on both, same prompts, same
      # data: lite spliced Arabic letters into Hebrew words — `מתורجם`,
      # `בمשימות`, `לبחון` — in fourteen of its answers, the Hebrew-only gate
      # refused every one of them, and a dimension ended on the deterministic
      # sentence. `gemini-3.5-flash` produced zero refusals on the same round
      # and wrote all eight stones on the first attempt.
      #
      # This is now the same model as `LLM_MODEL_HEAVY`, so the two paces below
      # spend one per-model budget rather than two. On the billed key that is
      # not the binding limit; on a free key it would be, and the honest fix
      # there is a smaller pace, not a return to a model that cannot spell.
      - key: LLM_MODEL_FAST
        value: "gemini-3.5-flash"
      # Left on the dashboard, and left on gemini-3.5-flash. It is reached only
      # when the safety validator rejects part of a round, and a replay now
      # sends it only the parts that were rejected — so it needs its own pace
      # rather than the fast model's, which is the variable below. Both are
      # unset here for the same reason the pace above is set: the model is on
      # the dashboard, and a pace is only meaningful beside the name it is
      # counted against.
      - key: LLM_MODEL_HEAVY
        sync: false
      # Thirty, half the fast pace, and measured the same way: the eval-corpus
      # runs of 2026-08-05 paced the heavy model at thirty while the fast one
      # ran at sixty. It stays a separate number rather than inheriting the
      # fast one — the free tier allowed 5 RPM and 20 RPD here against 15 and
      # 1000 there, so the two buckets were never the same size and a billed
      # key does not make them one. Unset defaults to five in `config.py`,
      # deliberately not to the fast pace, which would rebuild the defect the
      # next time that number moved.
      #
      # The daily count was the residual risk no pace could fix: a replay used
      # to rewrite the whole round, seventeen heavy requests of the twenty a day
      # to repair one stone. A replay now writes only what the validator
      # rejected — one request for one dimension, measured — so on the free key
      # the day was reached only by a round rejected in many dimensions over and
      # over, and on a billed key it is not the binding limit at all.
      - key: LLM_MAX_REQUESTS_PER_MINUTE_HEAVY
        value: "30"
      # False: the model writes all eight dimensions, green included. It was
      # true to save tokens when a round did not fit in a day, and that reason
      # is gone — the live round of 2026-07-29 was already an all-eight-model
      # round at 22 requests with no 429, because none of its dimensions came
      # out green. What it costs is up to five more requests against 1000 a day;
      # what it buys is eight paragraphs of one quality instead of seven and a
      # formula. A green dimension the model refuses still gets the
      # deterministic sentence rather than a gap, labelled
      # `deterministic_fallback` like it always was.
      #
      # Declared here rather than left to the dashboard because it was neither:
      # unset in both, it defaulted to true in `config.py`, so the decision
      # lived nowhere a reader could find it.
      # `LLM_REASONING_EFFORT` is deliberately absent, and the reason is worth
      # more than the variable would be.
      #
      # Thinking tokens bill at the output rate — $9 per million against $1.50
      # for input — and until 2026-08-19 this service said nothing about them,
      # so the provider's default decided the largest line of every round.
      # Measured that day on one round, `gemini-3.5-flash` at these settings:
      # unset spends 58,885 thinking tokens, 89% of billed output, $0.62;
      # `medium` spends 59,845 and $0.63, so unset *is* medium and the knob only
      # does something below it; `low` spends 24,742 and $0.38, a 39% saving,
      # and returned the same eight stones.
      #
      # The eval corpus then said what one round could not. Seven analysed
      # cases each way, `evals/baselines/2026-08-19-gemini-3.5-flash.json`
      # against `...-reasoning-low.json`: the graders barely move — mean 0.9644
      # to 0.9586, `distinctness` identical, no Hebrew refusal anywhere — but
      # unset wrote 56 of 56 stones with the model and `low` wrote 53. Three
      # paragraphs came back as this service's own sentence.
      #
      # And all three were lost to `TimeoutError`, not to the model: a request
      # bounded at 20 seconds inside a 25-second retry budget, so an attempt
      # that times out leaves no room for another. That budget is capped at 25
      # in `config.py`, written when this call had to fit the core app's HTTP
      # timeout — which it has not had to since the webhook started answering
      # `202` before the run. Raise that first; `low` is worth 39% only once a
      # slow answer is waited for rather than abandoned.
      - key: ONLY_LLM_FOR_PROBLEMATIC
        value: "false"
