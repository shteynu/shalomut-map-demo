name: Vercel Deployment & Pipeline Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest

    # `npm run verify` includes `verify:db`, whose unique-constraint and
    # parallel-submission cases are database behaviour: an in-memory repository
    # is single-threaded and cannot race, so it can prove the contract but never
    # the concurrency. Without this service those tests would ship green and
    # never run.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shalomut
          POSTGRES_PASSWORD: shalomut
          POSTGRES_DB: shalomut_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U shalomut -d shalomut_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Only the disposable suite reads this. It is deliberately not
      # DATABASE_URL: nothing in the build may reach a real database.
      TEST_DATABASE_URL: postgresql://shalomut:shalomut@127.0.0.1:5433/shalomut_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ai-analytics-service/requirements.txt
            ai-analytics-service/pyproject.toml

      - name: Install Node.js dependencies
        run: npm ci

      - name: Create Python virtual environment
        run: python -m venv ai-analytics-service/.venv

      - name: Install Python dependencies
        working-directory: ai-analytics-service
        run: .venv/bin/python -m pip install -r requirements.txt -e '.[dev]'

      - name: Run canonical verification
        run: npm run verify

      # The mutation runner has its own wiring — a test runner, a mutated file
      # list and a test file list — and none of it is exercised by `npm run
      # verify`. A dry run starts Stryker, instruments the sources and runs the
      # listed tests once without mutating anything, so a config that no longer
      # starts is caught here rather than the next time somebody asks how
      # strong the tests are.
      #
      # This is deliberately not a mutation run and deliberately not a score
      # gate. The score moves when a function changes file or a test file joins
      # the list, neither of which is a change in test strength; a threshold on
      # it would fail honest work and pass the refactor that quietly removed a
      # rule from measurement. See `ROADMAP.md`.
      - name: Check that the mutation runner still starts
        run: npm run test:mutation:ai-contract -- --dryRunOnly

      # Everything above this line is verified without a browser, and cannot
      # see the half of the product that only exists once a page renders: a
      # server component that throws, a reading order that flipped, a share
      # link the manager screen stopped showing. One path covers it — sign in,
      # read the link, open it as a respondent, look at the map.
      #
      # It needs a database with a round in it, which is why DATABASE_URL
      # appears here and nowhere else: the build above must never reach one.
      # This is the disposable service database, seeded after `verify:db` has
      # finished emptying it.
      #
      # The sign-in credentials come from `playwright.config.ts`, which starts
      # the server itself with values it invents. No secret is configured for
      # this job, and none should be.
      - name: Install the smoke browser
        run: npx playwright install --with-deps chromium

      - name: Smoke the manager and respondent flow in a browser
        env:
          DATABASE_URL: postgresql://shalomut:shalomut@127.0.0.1:5433/shalomut_test
        run: |
          npm run db:migrate:deploy
          npm run db:seed:local
          npx playwright test

      - name: Keep the smoke's report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-prod-manual:
    name: Deploy to Production (Manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'production'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel Production
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
