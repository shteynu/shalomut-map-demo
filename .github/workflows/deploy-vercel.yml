name: Vercel Deployment & Pipeline Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ai-analytics-service/requirements.txt
            ai-analytics-service/pyproject.toml

      - name: Install Node.js dependencies
        run: npm ci

      - name: Create Python virtual environment
        run: python -m venv ai-analytics-service/.venv

      - name: Install Python dependencies
        working-directory: ai-analytics-service
        run: .venv/bin/python -m pip install -r requirements.txt -e '.[dev]'

      - name: Run canonical verification
        run: npm run verify

  deploy-prod-manual:
    name: Deploy to Production (Manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'production'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel Production
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
