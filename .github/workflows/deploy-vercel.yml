name: Vercel Deployment & Pipeline Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest

    # `npm run verify` includes `verify:db`, whose unique-constraint and
    # parallel-submission cases are database behaviour: an in-memory repository
    # is single-threaded and cannot race, so it can prove the contract but never
    # the concurrency. Without this service those tests would ship green and
    # never run.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shalomut
          POSTGRES_PASSWORD: shalomut
          POSTGRES_DB: shalomut_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U shalomut -d shalomut_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Only the disposable suite reads this. It is deliberately not
      # DATABASE_URL: nothing in the build may reach a real database.
      TEST_DATABASE_URL: postgresql://shalomut:shalomut@127.0.0.1:5433/shalomut_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ai-analytics-service/requirements.txt
            ai-analytics-service/pyproject.toml

      - name: Install Node.js dependencies
        run: npm ci

      - name: Create Python virtual environment
        run: python -m venv ai-analytics-service/.venv

      - name: Install Python dependencies
        working-directory: ai-analytics-service
        run: .venv/bin/python -m pip install -r requirements.txt -e '.[dev]'

      - name: Run canonical verification
        run: npm run verify

  deploy-prod-manual:
    name: Deploy to Production (Manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'production'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel Production
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
