name: Vercel Deployment & Pipeline Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest

    # `npm run verify` includes `verify:db`, whose unique-constraint and
    # parallel-submission cases are database behaviour: an in-memory repository
    # is single-threaded and cannot race, so it can prove the contract but never
    # the concurrency. Without this service those tests would ship green and
    # never run.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shalomut
          POSTGRES_PASSWORD: shalomut
          POSTGRES_DB: shalomut_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U shalomut -d shalomut_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Only the disposable suite reads this. It is deliberately not
      # DATABASE_URL: nothing in the build may reach a real database.
      TEST_DATABASE_URL: postgresql://shalomut:shalomut@127.0.0.1:5433/shalomut_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ai-analytics-service/requirements.txt
            ai-analytics-service/requirements-dev.txt

      - name: Install Node.js dependencies
        run: npm ci

      # The same two commands as `verify-core.yml` and
      # `docs/local-environment.md`, and the same lock the `Dockerfile`
      # installs: this gate has to run the packages Render will run, or it
      # gates a different service than the one that deploys.
      - name: Create Python virtual environment
        run: python -m venv ai-analytics-service/.venv

      - name: Install Python dependencies
        working-directory: ai-analytics-service
        run: .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt && .venv/bin/python -m pip install --no-deps -e .

      - name: Run canonical verification
        run: npm run verify

      # The mutation runner has its own wiring — a test runner, a mutated file
      # list and a test file list — and none of it is exercised by `npm run
      # verify`. A dry run starts Stryker, instruments the sources and runs the
      # listed tests once without mutating anything, so a config that no longer
      # starts is caught here rather than the next time somebody asks how
      # strong the tests are.
      #
      # This is deliberately not a mutation run and deliberately not a score
      # gate. The score moves when a function changes file or a test file joins
      # the list, neither of which is a change in test strength; a threshold on
      # it would fail honest work and pass the refactor that quietly removed a
      # rule from measurement. See `ROADMAP.md`.
      - name: Check that the mutation runner still starts
        run: npm run test:mutation:ai-contract -- --dryRunOnly

      # The browser smoke used to end this job and now lives in
      # `browser-smoke.yml`, which runs on every branch. It was moved on
      # 2026-08-15, after a stack that had been green on every branch gate
      # landed on `main` and only then met Playwright — red, on a stale
      # assertion. Running it here as well would buy nothing and cost a second
      # Postgres, a second Chromium and three minutes on every push to `main`.
      #
      # One consequence, stated rather than left to be discovered: the manual
      # deployment below waits on `npm run verify` and the mutation dry run, and
      # no longer on a browser. The smoke's red X arrives on its own workflow,
      # at the same commit, usually sooner than this job finishes.

  deploy-prod-manual:
    name: Deploy to Production (Manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'production'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # This job does not migrate, and does not need to. `vercel deploy --prod`
      # asks Vercel to build, and every Vercel build runs `npm run build`, whose
      # first step is `scripts/deploy-migrate.mjs`. Adding a migration step here
      # would cover this path twice and Vercel's own git deployments — which are
      # how nearly every deploy actually happens — not at all. See ADR-031.
      - name: Deploy to Vercel Production
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
