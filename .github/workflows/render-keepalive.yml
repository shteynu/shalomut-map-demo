name: "Wake the Render AI service"

# The AI analytics service runs on Render's free plan, which sleeps an instance
# after fifteen minutes without inbound traffic. Sleep is not only a cold start:
# durable analysis jobs are claimed by that service polling Core, and a sleeping
# instance polls nothing, so a queued round waits for a visitor instead of being
# worked. Its own outbound polling does not count as traffic — only a request
# arriving from outside does, which is what this workflow sends.
#
# This workflow used to carry `schedule: */10 * * * *` and be the keep-alive
# itself. It is not, and the reason is measured rather than assumed: on
# 2026-08-05 the workflow sat on `main` from 14:21Z and the run list was read
# every two minutes until 16:05Z. Ten cron windows passed and not one scheduled
# run ever appeared, while `workflow_dispatch` finished green in 9s. GitHub's
# scheduler is best-effort, skips runs under load rather than queueing them, and
# throttles short periods like `*/10` hardest. A keep-alive that may silently
# never fire is worse than none: it reads as covered.
#
# The keep-alive is therefore an external uptime monitor hitting the same
# `/health` every five minutes. It lives outside this repository — see
# `docs/shalomut-tracker-handoff.md` for which service holds it. The paid Render
# instance type is the version that needs neither.
#
# What is left here is the manual wake: one dispatch before a demo or a round,
# when the instance may have been asleep and the first request would otherwise
# pay the cold start. It is also the cheapest way to prove `/health` is
# reachable from outside the owner's own network.

on:
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the service and read its health
        run: |
          set -euo pipefail
          url="https://shalomut-ai-analytics.onrender.com/health"
          # --max-time 150 rather than a default: a request that arrives during
          # a cold start waits for the container to build up, which the free
          # plan documents as roughly a minute and which has been slower.
          # One retry covers the cold start that ends after the first attempt
          # has already given up.
          body="$(curl -fsS --max-time 150 --retry 1 --retry-delay 15 "$url")"
          echo "$body"
          case "$body" in
            *'"status":"online"'*) ;;
            *)
              echo "::error::/health answered without status online"
              exit 1
              ;;
          esac
