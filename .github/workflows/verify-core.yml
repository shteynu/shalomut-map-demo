# The core gate, on every branch and as fast as it can report.
#
# `deploy-vercel.yml` already runs `npm run verify`, which chains this gate —
# but only on `main` and on pull requests targeting it, and only behind a
# Postgres service and a migration. Two things follow. Work on a branch or in
# an agent worktree is unverified until it lands, and when it does land, the
# first red X arrives several minutes after the one that mattered.
#
# So this job runs everywhere and carries nothing it does not need: no
# database service, no browsers, no seeded round. `verify:core` is the half
# that needs none of them, and it is the half that fails most often.
#
# On `main` that overlaps `deploy-vercel.yml` on purpose. The two run in
# parallel; this one answers "do the lints, types, tests and build pass?" while
# the other is still starting Postgres. `verify:db` and `verify:ai` stay there,
# where the fixtures they need already exist. The browser smoke is a third
# workflow, `browser-smoke.yml`, which runs on every branch as this one does —
# it was a step of the deploy workflow until 2026-08-15, and a branch could not
# reach it.
name: Core verification

on:
  push:
  workflow_dispatch:

# A branch under active work gets several pushes a minute. Only the newest one
# is worth a runner.
concurrency:
  group: verify-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-core:
    name: npm run verify:core
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # 3.11 is what `Dockerfile` ships to Render and what `deploy-vercel.yml`
      # already installs, so all three agree on the interpreter the service
      # runs under.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-analytics-service/requirements-dev.txt

      - name: Install Node.js dependencies
        run: npm ci

      # `npm test` drives the real Python pipeline through
      # `scripts/ai-service-python.mjs`, which resolves this virtualenv and
      # refuses to fall back to a system interpreter. Without these two steps
      # the cross-service tests fail by design, naming the missing environment.
      #
      # The command is character-for-character the one in
      # `docs/local-environment.md`, so a run here also proves the setup a
      # newcomer is told to follow still works.
      - name: Create the AI service virtualenv
        working-directory: ai-analytics-service
        run: python3 -m venv .venv && .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt && .venv/bin/python -m pip install --no-deps -e .

      # No DATABASE_URL, deliberately, matching the rule `deploy-vercel.yml`
      # states for its own build: nothing in this gate may reach a database.
      # `verify:core` never needs one — the suite it runs uses in-memory
      # repositories, and `__dbtests__` belong to `verify:db`.
      - name: Run the core verification gate
        run: npm run verify:core
