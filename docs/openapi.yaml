    StoneGenerationProvenanceV5:
      type: object
      description: >-
        5.0 provenance. `unavailable` exists only here: it means the provider
        never wrote this dimension's interpretation, and the stone carries an
        empty one. It is the absence of copy said out loud, not a third kind of
        copy — a stone claiming `deterministic_fallback` with heuristic text
        would be the fallback posing as analysis. The three inclusion booleans
        record what reached the prompt; consumers tolerate their absence and the
        5.0 producer always sets them.
      required: [outcome, attempts, retryCount, sourceQuestionIds, surveyDefinitionHash]
      properties:
        outcome:
          type: string
          enum: [llm, deterministic_fallback, unavailable]
        attempts:
          type: integer
          minimum: 0
        retryCount:
          type: integer
          minimum: 0
        sourceQuestionIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        surveyDefinitionHash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        backgroundContextIncluded:
          type: boolean
        distributionIncluded:
          type: boolean
        crossDimensionContextIncluded:
          type: boolean
    StoneDetailV5:
      type: object
      description: A 5.0 stone. Its interpretation runs two to five sentences, or is exactly empty when the provenance outcome is `unavailable`. Score, metrics and recommendations are present either way — on a stone with no interpretation they are all still real, and only the paragraph is missing.
      required: [dimensionId, dimensionNameHebrew, status, score, psychologicalInterpretation, recommendedInterventions, metrics, generationProvenance]
      properties:
        dimensionId:
          $ref: '#/components/schemas/WellbeingDimensionId'
        dimensionNameHebrew:
          type: string
        status:
          $ref: '#/components/schemas/WellbeingStatus'
        score:
          type: number
          minimum: 0
          maximum: 100
        psychologicalInterpretation:
          type: string
        recommendedInterventions:
          type: array
          items:
            $ref: '#/components/schemas/StoneInterventionV5'
        metrics:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/StoneMetricV5'
        generationProvenance:
          $ref: '#/components/schemas/StoneGenerationProvenanceV5'
    StoneMapResultV5:
      type: object
      description: >-
        Output contract 5.0, the current one. Successful payloads contain
        exactly eight stones, question metrics carrying the input distribution,
        per-entry adaptation provenance, and an LLM-written overall summary of
        two to four sentences. A round may be partial: where the provider wrote
        nothing for some dimensions, those stones carry an empty interpretation
        and are listed in dimensionsWithoutInterpretation. A round where no
        dimension was written at all is a failure rather than a partial map.
      required: [contractVersion, roundId, surveyDefinitionHash, isLocked, status]
      properties:
        contractVersion:
          type: string
          enum: ["5.0"]
          example: "5.0"
        roundId:
          type: string
          example: 4f88af95-0ec4-4872-85ac-67466c3cd8f2
        surveyDefinitionHash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        processedAt:
          type: string
          format: date-time
        isLocked:
          type: boolean
        status:
          type: string
          enum: [success, locked_error, validation_failed]
        errorMessage:
          type: string
        overallPsychologicalSummary:
          type: string
        dimensionsWithoutInterpretation:
          type: array
          description: Exactly the dimensions whose stone provenance reads `unavailable`, and omitted entirely when the map is whole. Consumers reject a list that disagrees with the stones — a banner claiming two missing dimensions over a map missing three is how a reader stops trusting the screen.
          maxItems: 7
          uniqueItems: true
          items:
