    StoneMapResult:
      description: Consumer-first compatibility union. Core accepts immutable 1.0/2.0, dynamic 3.0/4.0/5.0 and narrative output 6.0.
      oneOf:
        - $ref: '#/components/schemas/StoneMapResultV1'
        - $ref: '#/components/schemas/StoneMapResultV2'
        - $ref: '#/components/schemas/StoneMapResultV3'
        - $ref: '#/components/schemas/StoneMapResultV4'
        - $ref: '#/components/schemas/StoneMapResultV5'
        - $ref: '#/components/schemas/StoneMapResultV6'
      discriminator:
        propertyName: contractVersion
        mapping:
          "1.0": '#/components/schemas/StoneMapResultV1'
          "2.0": '#/components/schemas/StoneMapResultV2'
          "3.0": '#/components/schemas/StoneMapResultV3'
          "4.0": '#/components/schemas/StoneMapResultV4'
          "5.0": '#/components/schemas/StoneMapResultV5'
          "6.0": '#/components/schemas/StoneMapResultV6'
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    SurveySubmissionError:
      type: object
      description: >-
        A refused submission. `error` is human-readable and may change; `code`
        is the stable value clients branch on. A refusal without `code` is an
        unexpected failure and should be treated as retryable.
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - ROUND_NOT_FOUND
            - ROUND_NOT_ACTIVE
            - DEFINITION_INVALID
            - INVALID_ANSWERS
            - ALREADY_SUBMITTED
